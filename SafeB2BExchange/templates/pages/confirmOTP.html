{% extends "main2.html" %}
{% block tilte %}confirm OTP{% endblock %}
{% block content %}
<main class="login-container py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="otp-card bg-white p-4">
                    <div class="text-center mb-4">
                        <h3 class="text-primary"><i class="bi bi-shield-check"></i> Verify Identity</h3>
                        <p class="text-muted">Enter the 6-digit code sent to <span class="fw-bold">johndoe@company.com</span></p>
                    </div>
                    
                    <form id="otpVerificationForm" action="" method="POST">
                        <div class="d-flex justify-content-center mb-4">
                            <input type="text" class="otp-input form-control" maxlength="1" pattern="\d" required>
                            <input type="text" class="otp-input form-control" maxlength="1" pattern="\d" required>
                            <input type="text" class="otp-input form-control" maxlength="1" pattern="\d" required>
                            <input type="text" class="otp-input form-control" maxlength="1" pattern="\d" required>
                            <input type="text" class="otp-input form-control" maxlength="1" pattern="\d" required>
                            <input type="text" class="otp-input form-control" maxlength="1" pattern="\d" required>
                            <input type="hidden" name="otp_code" id="fullOtp">
                        </div>
                        
                        <div class="text-center mb-4">
                            <p class="countdown text-muted">Code expires in <span id="timer">02:59</span></p>
                            <p class="mb-0">Didn't receive code? <span class="resend-link text-primary">Resend</span></p>
                        </div>
                        
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary py-2">
                                <i class="bi bi-check-circle me-1"></i> Verify & Continue
                            </button>
                            <a href="{% url 'send_otp_page' %}" type="button" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-left me-1"></i> Change Verification Method
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
{% endblock %}
