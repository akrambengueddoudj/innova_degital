{% extends "main2.html" %}
{% block tilte %}Create Account{% endblock %}
{% block content %}
<main class="login-container py-5">
  <div class="container">
      <div class="row justify-content-center">
          <div class="col-md-8 col-lg-6">
              <div class="password-card bg-white p-4">
                  <div class="text-center mb-4">
                      <h3 class="text-primary"><i class="bi bi-shield-lock"></i> Change Password</h3>
                      <p class="text-muted">For your security, please update your password regularly</p>
                  </div>
                  
                  <form id="changePasswordForm">
                      <!-- Current Password -->
                      <div class="mb-3">
                          <label for="currentPassword" class="form-label">Current Password</label>
                          <div class="input-group">
                              <input type="password" class="form-control" id="currentPassword" required>
                              <button class="btn btn-outline-secondary toggle-password" type="button">
                                  <i class="bi bi-eye"></i>
                              </button>
                          </div>
                      </div>
                      
                      <!-- New Password -->
                      <div class="mb-3">
                          <label for="newPassword" class="form-label">New Password</label>
                          <div class="input-group">
                              <input type="password" class="form-control" id="newPassword" required>
                              <button class="btn btn-outline-secondary toggle-password" type="button">
                                  <i class="bi bi-eye"></i>
                              </button>
                          </div>
                          <div class="password-strength progress mt-1">
                              <div class="progress-bar bg-danger" role="progressbar" style="width: 0%"></div>
                          </div>
                          <div class="password-criteria mt-2">
                              <p class="mb-1"><span id="length" class="text-muted">• 8+ characters</span></p>
                              <p class="mb-1"><span id="number" class="text-muted">• At least 1 number</span></p>
                              <p class="mb-1"><span id="special" class="text-muted">• At least 1 special character</span></p>
                          </div>
                      </div>
                      
                      <!-- Confirm Password -->
                      <div class="mb-4">
                          <label for="confirmPassword" class="form-label">Confirm New Password</label>
                          <div class="input-group">
                              <input type="password" class="form-control" id="confirmPassword" required>
                              <button class="btn btn-outline-secondary toggle-password" type="button">
                                  <i class="bi bi-eye"></i>
                              </button>
                          </div>
                          <div class="invalid-feedback" id="passwordMatchFeedback">
                              Passwords do not match
                          </div>
                      </div>
                      
                      <div class="d-grid gap-2">
                          <button type="submit" class="btn btn-primary py-2">
                              <i class="bi bi-check-circle me-1"></i> Update Password
                          </button>
                          <a href="{% url 'index_page' %}" class="btn btn-outline-secondary">
                              <i class="bi bi-arrow-left me-1"></i> Back to Dashboard
                          </a>
                      </div>
                  </form>
              </div>
          </div>
      </div>
  </div>
</main>
{% endblock %}
