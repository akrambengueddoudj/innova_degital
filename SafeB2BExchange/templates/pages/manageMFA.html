{% extends "main2.html" %}
{% block tilte %}manage MFA{% endblock %}
{% block content %}
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="mfa-card card p-4">
                <div class="card-body text-center">
                    <div class="mb-4">
                        <i class="bi bi-phone-fill fs-1 text-primary"></i>
                        <h3 class="mt-2">SMS Verification</h3>
                        <p class="text-muted">Receive one-time codes via text message</p>
                    </div>
                    
                    <!-- Active State (shown when enabled) -->
                    <div id="activeState">
                        <div class="alert alert-success mb-4">
                            <i class="bi bi-check-circle-fill me-2"></i>
                            SMS verification is <strong>active</strong> for +1 (555) ***-4567
                        </div>
                        <button class="btn btn-outline-danger w-100">
                            <i class="bi bi-slash-circle me-1"></i> Disable SMS Verification
                        </button>
                    </div>
                    
                    <!-- Inactive State (hidden when enabled) -->
                    <div id="inactiveState" class="d-none">
                        <div class="alert alert-warning mb-4">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i>
                            SMS verification is <strong>not active</strong>
                        </div>
                        <button class="btn btn-primary w-100">
                            <i class="bi bi-check-circle me-1"></i> Enable SMS Verification
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
{% endblock %}
