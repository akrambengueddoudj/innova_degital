{% extends "main2.html" %}
{% load socialaccount %}
{% block tilte %}Sign In{% endblock %}
{% block content %}
<main class="login-container">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="login-card">
                    <div class="login-header">
                        <h4>Secure Document Exchange</h4>
                        <p class="mb-0">Banking & Enterprise Platform</p>
                    </div>
                    <div class="login-body">
                        <!-- Login Form -->
                        <form id="loginForm" method="POST" action="{% url 'account_signin' %}">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label for="email" class="form-label">Email Address</label>
                                <input type="email" class="form-control" id="email" name="email" placeholder="name@company.com" required>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" name="password" id="password" placeholder="••••••••" required>
                            </div>

                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="remember">
                                    <label class="form-check-label" for="remember">Remember me</label>
                                </div>
                                <a href="#" class="text-decoration-none">Forgot password?</a>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2">Sign in</button>
                        </form>
                        <div class="social-login mt-3">
                            <p class="text-center text-muted mb-3">Or sign in with</p>
                            <a href="{% provider_login_url 'google' process='login' %}" class="btn btn-outline-secondary w-100 py-2 mb-2">
                                <i class="bi bi-google"></i> Continue with Google
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
{% endblock %}
