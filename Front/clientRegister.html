<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureB2B | Login</title>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css">
    <!-- Custom CSS with Variables -->
    <link rel="stylesheet" href="./main.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
          <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start w-100">
            <a class="navbar-brand me-5" href="/">
                <i class="bi bi-shield-lock-fill"></i>
                SecureB2B
            </a>
    
            <ul class="nav col-12 col-lg-auto me-lg-auto mb-2 justify-content-center mb-md-0">
              <li><a href="#" class="nav-link px-2 text-secondary">Home</a></li>
              <li><a href="#" class="nav-link px-2">Features</a></li>
              <li><a href="#" class="nav-link px-2">Pricing</a></li>
              <li><a href="#" class="nav-link px-2">FAQs</a></li>
              <li><a href="#" class="nav-link px-2">About</a></li>
            </ul>
    
            <div class="text-end">
              <button type="button" class="btn btn-outline-primary me-2">Login</button>
              <button type="button" class="btn btn-primary">Sign-up</button>
            </div>
          </div>
        </div>
    </nav>

    <!-- Main Login Content -->
    <main class="login-container">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">
                    <div class="login-card">
                        <div class="login-header">
                            <h4>Secure Document Exchange</h4>
                            <p class="mb-0">Banking & Enterprise Platform</p>
                        </div>
                        <div class="login-body">
                          <div class="container">
                            <h2 class="mb-4">Step 2: Client Company Info</h2>
                            <form method="POST">
                        
                              <input type="hidden" name="role" value="client">
                        
                              <div class="form-floating mb-3">
                                <input type="text" class="form-control" name="company_name" id="company_name" placeholder="Company Name" required>
                                <label for="company_name">Company Name</label>
                              </div>
                        
                              <div class="form-floating mb-3">
                                <input type="text" class="form-control" name="company_id" id="company_id" placeholder="Registration/Tax ID" required>
                                <label for="company_id">Registration Number / Tax ID</label>
                              </div>
                        
                              <div class="form-floating mb-3">
                                <input type="text" class="form-control" name="company_type" id="company_type" placeholder="Company Type" required>
                                <label for="company_type">Company Type (LLC, SARL...)</label>
                              </div>
                        
                              <div class="form-floating mb-3">
                                <input type="text" class="form-control" name="industry" id="industry" placeholder="Industry Sector" required>
                                <label for="industry">Industry Sector</label>
                              </div>
                        
                              <div class="form-floating mb-3">
                                <input type="text" class="form-control" name="position" id="position" placeholder="Your Position" required>
                                <label for="position">Your Position</label>
                              </div>
                        
                              <div class="form-floating mb-3">
                                <input type="text" class="form-control" name="address" id="address" placeholder="Business Address" required>
                                <label for="address">Business Address</label>
                              </div>
                        
                              <div class="mb-5">
                                <label for="company_docs" class="form-label">Upload Company Docs (PDF/JPG/PNG, optional)</label>
                                <input type="file" class="form-control" name="company_docs" id="company_docs" accept=".pdf,.jpg,.png">
                              </div>
                        
                              <div class="d-flex gap-2">
                                <button type="button" onclick="history.back()" class="btn btn-secondary w-25">Back</button>
                                <button type="submit" class="btn btn-primary w-75">Register</button>
                              </div>
                            </form>
                          </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="row">
                <div class="col-md-6 text-center text-md-start">
                    <span class="text-muted">© 2024 SecureB2B. All rights reserved.</span>
                </div>
                <div class="col-md-6 text-center text-md-end">
                    <a href="#" class="text-decoration-none me-3">Terms</a>
                    <a href="#" class="text-decoration-none me-3">Privacy</a>
                    <a href="#" class="text-decoration-none">Security</a>
                </div>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./main.js"></script>
</body>
</html>
