<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureB2B | Login</title>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css">
    <!-- Custom CSS with Variables -->
    <link rel="stylesheet" href="./main.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
          <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start w-100">
            <a class="navbar-brand me-5" href="/">
                <i class="bi bi-shield-lock-fill"></i>
                SecureB2B
            </a>
    
            <ul class="nav col-12 col-lg-auto me-lg-auto mb-2 justify-content-center mb-md-0">
              <li><a href="#" class="nav-link px-2 text-secondary">Home</a></li>
              <li><a href="#" class="nav-link px-2">Features</a></li>
              <li><a href="#" class="nav-link px-2">Pricing</a></li>
              <li><a href="#" class="nav-link px-2">FAQs</a></li>
              <li><a href="#" class="nav-link px-2">About</a></li>
            </ul>
    
            <div class="text-end">
              <button type="button" class="btn btn-outline-primary me-2">Login</button>
              <button type="button" class="btn btn-primary">Sign-up</button>
            </div>
          </div>
        </div>
    </nav>

    <!-- Main Login Content -->
    <main class="login-container py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">
                    <div class="otp-card bg-white p-4">
                        <div class="text-center mb-4">
                            <h3 class="text-primary"><i class="bi bi-shield-check"></i> Secure Verification</h3>
                            <p class="text-muted">Where should we send your verification code?</p>
                        </div>
                        
                        <form id="otpSelectionForm" action="{% url 'send_otp' %}" method="POST">
                            <div class="mb-4">
                                <!-- Email Option -->
                                <a href="#" class="otp-option p-3 mb-3 d-flex align-items-center text-decoration-none" id="emailOption">
                                    <div class="ms-3">
                                        <div class="d-flex align-items-center">
                                            <i class="bi bi-envelope-fill text-primary fs-4 me-3"></i>
                                            <div>
                                                <h5 class="mb-1">Send to Email</h5>
                                                <p class="text-muted small mb-0">johndoe@company.com</p>
                                            </div>
                                        </div>
                                    </div>
                                </a>
                                
                                <!-- SMS Option -->
                                <a href="#" class="otp-option p-3 d-flex align-items-center text-decoration-none" id="smsOption">
                                    <div class="ms-3">
                                        <div class="d-flex align-items-center">
                                            <i class="bi bi-phone-fill text-primary fs-4 me-3"></i>
                                            <div>
                                                <h5 class="mb-1">Send via SMS</h5>
                                                <p class="text-muted small mb-0">+1 (555) ***-4567</p>
                                            </div>
                                        </div>
                                    </div>
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
    
    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="row">
                <div class="col-md-6 text-center text-md-start">
                    <span class="text-muted">© 2024 SecureB2B. All rights reserved.</span>
                </div>
                <div class="col-md-6 text-center text-md-end">
                    <a href="#" class="text-decoration-none me-3">Terms</a>
                    <a href="#" class="text-decoration-none me-3">Privacy</a>
                    <a href="#" class="text-decoration-none">Security</a>
                </div>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./main.js"></script>
</body>
</html>
