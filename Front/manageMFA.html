<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureB2B | Login</title>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css">
    <!-- Custom CSS with Variables -->
    <link rel="stylesheet" href="./main.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
          <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start w-100">
            <a class="navbar-brand me-5" href="/">
                <i class="bi bi-shield-lock-fill"></i>
                SecureB2B
            </a>
    
            <ul class="nav col-12 col-lg-auto me-lg-auto mb-2 justify-content-center mb-md-0">
              <li><a href="#" class="nav-link px-2 text-secondary">Home</a></li>
              <li><a href="#" class="nav-link px-2">Features</a></li>
              <li><a href="#" class="nav-link px-2">Pricing</a></li>
              <li><a href="#" class="nav-link px-2">FAQs</a></li>
              <li><a href="#" class="nav-link px-2">About</a></li>
            </ul>
    
            <div class="text-end">
              <button type="button" class="btn btn-outline-primary me-2">Login</button>
              <button type="button" class="btn btn-primary">Sign-up</button>
            </div>
          </div>
        </div>
    </nav>

    <!-- Main Login Content -->
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="mfa-card card p-4">
                    <div class="card-body text-center">
                        <div class="mb-4">
                            <i class="bi bi-phone-fill fs-1 text-primary"></i>
                            <h3 class="mt-2">SMS Verification</h3>
                            <p class="text-muted">Receive one-time codes via text message</p>
                        </div>
                        
                        <!-- Active State (shown when enabled) -->
                        <div id="activeState">
                            <div class="alert alert-success mb-4">
                                <i class="bi bi-check-circle-fill me-2"></i>
                                SMS verification is <strong>active</strong> for +1 (555) ***-4567
                            </div>
                            <button class="btn btn-outline-danger w-100">
                                <i class="bi bi-slash-circle me-1"></i> Disable SMS Verification
                            </button>
                        </div>
                        
                        <!-- Inactive State (hidden when enabled) -->
                        <div id="inactiveState" class="d-none">
                            <div class="alert alert-warning mb-4">
                                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                                SMS verification is <strong>not active</strong>
                            </div>
                            <button class="btn btn-primary w-100">
                                <i class="bi bi-check-circle me-1"></i> Enable SMS Verification
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    
    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="row">
                <div class="col-md-6 text-center text-md-start">
                    <span class="text-muted">© 2024 SecureB2B. All rights reserved.</span>
                </div>
                <div class="col-md-6 text-center text-md-end">
                    <a href="#" class="text-decoration-none me-3">Terms</a>
                    <a href="#" class="text-decoration-none me-3">Privacy</a>
                    <a href="#" class="text-decoration-none">Security</a>
                </div>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./main.js"></script>
</body>
</html>
